    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovariot.QuickLookManager
        PRODUCT_NAME: QuickLookManager
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/AssetCarReader/PrivateFrameworks
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/AssetCarReader/PrivateFrameworks/CoreUI.framework
        CODE_SIGN_ENTITLEMENTS: Config/QuickLookManager.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    postBuildScripts:
      - name: Incorpora le librerie video
        script: '"$SRCROOT/scripts/embed-video-libs.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - target: QLMCore
      - target: AssetCarReader
      - target: QLMNative
      - target: QLMPreview
      - target: QLMThumbnail
      - target: ClassicIconsAgent
        copy:
          destination: executables
