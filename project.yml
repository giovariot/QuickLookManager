name: QuickLookManager
options:
  bundleIdPrefix: com.giovariot
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: it
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: V65ZSTAL42
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  ZIPFoundation:
    url: https://github.com/cavoco/ZIPFoundation.git
    revision: 514ad8d8e6b98b2c535d5653ab77e15b09a4fa61
  AndroidXML:
    url: https://github.com/relikd/AndroidXML
    exactVersion: 0.9.4
targets:
  QLMNative:
    type: framework
    platform: macOS
    preBuildScripts:
      - name: Controlla le librerie del modulo Video
        script: |
          if [ ! -f "$SRCROOT/Vendor/ffmpeg/lib/libavcodec.dylib" ]; then
            echo "error: ffmpeg non compilato: esegui scripts/vendor-video.sh (una volta) e riprova."
            exit 1
          fi
        basedOnDependencyAnalysis: false
    sources:
      - path: Modules/Native
        headerVisibility: public
      - path: Vendor/LibRaw/src
        excludes: ["Makefile", "**/*.h", "**/*_ph.cpp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovariot.QuickLookManager.Native
        PRODUCT_NAME: QLMNative
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"]
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/LibRaw", "$(SRCROOT)/Vendor/libarchive", "$(SRCROOT)/Vendor/ffmpeg/include"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/Vendor/ffmpeg/lib"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "LIBRAW_NOTHREADS=1"]
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        OTHER_CPLUSPLUSFLAGS: ["-w"]
        OTHER_LDFLAGS: ["-larchive", "-lavformat", "-lavcodec", "-lavutil", "-lswscale", "-lswresample", "-framework", "CoreMedia", "-framework", "CoreVideo", "-framework", "CoreImage"]
        WARNING_CFLAGS: ["-w"]
        INFOPLIST_KEY_NSHumanReadableCopyright: "Giovanni; LibRaw © LibRaw LLC (LGPL 2.1 / CDDL 1.0)"
  AssetCarReader:
    type: framework
    platform: macOS
    sources:
      - path: AssetCarReader
        excludes: [PrivateFrameworks, AssetCarReader.xcconfig]
    configFiles:
      Debug: AssetCarReader/AssetCarReader.xcconfig
      Release: AssetCarReader/AssetCarReader.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovariot.QuickLookManager.AssetCarReader
        PRODUCT_NAME: AssetCarReader
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        OTHER_LDFLAGS: ["-framework", "CoreUI"]
        SWIFT_INSTALL_MODULE: YES
        DEAD_CODE_STRIPPING: YES
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"]
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  QLMCore:
    type: framework
    platform: macOS
    sources:
      - path: Kit
      - path: Modules/Text/Sources
      - path: Modules/Apps/Sources
      - path: Modules/Raw/Sources
      - path: Modules/Models/Sources
      - path: Modules/EPS/Sources
      - path: Modules/Archives/Sources
      - path: Modules/Video/Player
      - path: Modules/Pkg/Sources
      - path: Modules/Text/Resources/Web
        type: folder
        buildPhase: resources
      - path: Modules/Apps/AppsResources
        type: folder
        buildPhase: resources
      - path: Modules/Text/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giovariot.QuickLookManager.Core
        PRODUCT_NAME: QLMCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@loader_path/Frameworks"]
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Giovanni"
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/AssetCarReader/PrivateFrameworks
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/AssetCarReader/PrivateFrameworks/CoreUI.framework
    postBuildScripts:
      - name: Incorpora Ghostscript
        script: '"$SRCROOT/scripts/embed-ghostscript.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: WebKit.framework
      - target: AssetCarReader
        embed: false
      - target: QLMNative
        embed: false
      - package: AndroidXML
      - package: ZIPFoundation
      - sdk: SceneKit.framework
      - sdk: AVFoundation.framework
      - sdk: QuickLookThumbnailing.framework

  ClassicIconsAgent:
    type: tool
    platform: macOS
    sources: [Agent/main.swift]
    settings:
      base:
        PRODUCT_NAME: IconeAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.giovariot.QuickLookManager.IconeAgent
        INFOPLIST_FILE: Agent/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: Config/IconeAgent.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/AssetCarReader/PrivateFrameworks
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/AssetCarReader/PrivateFrameworks/CoreUI.framework
    dependencies:
      - target: QLMCore
        embed: false

  QLMPreview:
    type: app-extension
    platform: macOS
    sources: [Extensions/Preview]
    info:
      path: Extensions/Preview/Info.plist
      properties:
        CFBundleDisplayName: QuickLook Manager Anteprima
