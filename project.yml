  QuickLookManager:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Agent/com.giovariot.QuickLookManager.IconeAgent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuickLook Manager
        CFBundleLocalizations: [it, en, fr, de, es, ar]
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Giovanni"
